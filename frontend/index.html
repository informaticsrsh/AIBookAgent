<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Book Writer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="chat-window">
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Enter your prompt here...">
        </div>
        <div id="controls">
            <button id="start-btn">Start Generation</button>
            <button id="stop-btn">Stop</button>
            <button id="expand-btn">Expand Manuscript</button>
            <button id="open-btn">Open Current Book</button>
        </div>
        <div id="settings">
            <input type="password" id="api-key-input" placeholder="Enter your API key">
            <button id="save-api-key-btn">Save API Key</button>
            <br>
            <label for="rules-file">Author Rules File:</label>
            <input type="file" id="rules-file">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
